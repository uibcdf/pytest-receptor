schema_version: 1
workflows:
  - match:
      path: .github/workflows/build_and_upload_conda_packages.yaml
    profile: conda
    settings:
      package_kind: noarch
  - match:
      path: .github/workflows/docs.yml
    profile: docs
  - match:
      path: .github/workflows/promote_conda_package.yaml
    profile: release
  - match:
      path: .github/workflows/release.yml
    profile: release
  - match:
      path: .github/workflows/tests.yml
    profile: ci
