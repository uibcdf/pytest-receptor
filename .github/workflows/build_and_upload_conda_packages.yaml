name: Build and upload conda packages
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full immutable source candidate SHA
        required: true
        type: string
      version:
        description: Version in the committed staged release plan
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  publish:
    uses: uibcdf/molsyssuite/.github/workflows/publish-noarch-conda.yaml@95f693be10c9205ab9b912cb53453710a207bf45
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      version: ${{ inputs.version }}
    secrets:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
