name: Build and upload conda packages
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full immutable source candidate SHA
        required: true
        type: string
      version:
        description: Version in the committed staged release plan
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  publish:
    uses: uibcdf/molsyssuite/.github/workflows/publish-noarch-conda.yaml@2fb344525ca0eea817dc24a518f4a6bf26e311cf
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      version: ${{ inputs.version }}
    secrets:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
