name: Full compatibility matrix

on:
  schedule:
    - cron: "11 9 * * TUE"
    - cron: "7 1 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      probe_backlog:
        description: Check skipped-commit debt without running the matrix
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  nightly-decision:
    name: Check skipped-commit backlog
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '7 1 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.probe_backlog == true)
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide whether to run the full matrix
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python devtools/ci_backlog.py

  full-test:
    name: Full ${{ matrix.os }} / py${{ matrix.python }} / pytest ${{ matrix.pytest }}
    needs: nightly-decision
    if: >-
      always() && inputs.probe_backlog != true
      && (github.event_name != 'schedule' || github.event.schedule != '7 1 * * *'
      || needs.nightly-decision.result != 'success'
      || needs.nightly-decision.outputs.run_full == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: full-tests-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.pytest }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        pytest: ["8", "9"]
        include:
          - {os: macos-15, python: "3.13", pytest: "8"}
          - {os: macos-15, python: "3.13", pytest: "9"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned pytest and the integration matrix
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest~=${{ matrix.pytest }}.0" -e ".[test]"
      - name: Verify interpreter, architecture and pytest major
        env:
          WANT: ${{ matrix.pytest }}
        run: |
          python -c "import os, platform, pytest; print(platform.python_version(), platform.machine(), pytest.__version__); assert pytest.__version__.split('.')[0] == os.environ['WANT']; assert platform.system() != 'Darwin' or platform.machine() == 'arm64'"
      - name: Run the suite
        run: python -m pytest tests/ --receptor=ci
      - name: Run the suite distributed
        run: python -m pytest tests/ -n 2 --receptor=ci
