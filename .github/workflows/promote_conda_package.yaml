name: Promote an exact conda package
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full release commit SHA
        required: true
        type: string
      version:
        description: Version in the committed staged release plan
        required: true
        type: string
      sha256:
        description: Digest of the qualified staged file
        required: true
        type: string
      installed_run_id:
        description: Successful exact-file installed matrix run
        required: true
        type: string
      qualification_sha:
        description: Reviewed installed-workflow commit, separate from original producer
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  promote:
    uses: uibcdf/molsyssuite/.github/workflows/promote-noarch-conda.yaml@c3e2b9b3dabf3d1c65349c389a23048957bea21a
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      version: ${{ inputs.version }}
      sha256: ${{ inputs.sha256 }}
      installed_run_id: ${{ inputs.installed_run_id }}
      qualification_sha: ${{ inputs.qualification_sha }}
    secrets:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
