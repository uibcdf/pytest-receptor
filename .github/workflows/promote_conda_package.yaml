name: Promote an exact conda package
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full release commit SHA
        required: true
        type: string
      version:
        description: Version in the committed staged release plan
        required: true
        type: string
      sha256:
        description: Digest of the qualified staged file
        required: true
        type: string
      installed_run_id:
        description: Successful exact-file installed matrix run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  promote:
    uses: uibcdf/molsyssuite/.github/workflows/promote-noarch-conda.yaml@5a90853d4ac147f7b831cfc37f9f5defd87c190a
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      version: ${{ inputs.version }}
      sha256: ${{ inputs.sha256 }}
      installed_run_id: ${{ inputs.installed_run_id }}
    secrets:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
