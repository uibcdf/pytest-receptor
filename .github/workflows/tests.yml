name: Tests

# A pytest plugin's primary dependency is also its extension host, and this one
# reaches into reporter behaviour, so compatibility has to be evidence rather
# than an open-ended `pytest>=8` claim (PR-REL-001).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[lint]"
      - run: ruff check pytest_receptor tests devtools docs/conf.py
      - run: ruff format --check pytest_receptor tests devtools docs/conf.py

  test:
    name: py${{ matrix.python }} / pytest ${{ matrix.pytest }}
    runs-on: ubuntu-latest
    # Python 3.14 is an evidence lane for uibcdf/pytest-receptor#3. It does not
    # become a support claim until metadata and the MolSysSuite policy admit it.
    continue-on-error: ${{ matrix.python == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        # The supported range, at both pytest majors, plus one non-claiming
        # compatibility probe for the proposed next interpreter.
        python: ["3.11", "3.12", "3.13", "3.14"]
        pytest: ["8", "9"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned pytest and the integration matrix
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.python }}" == "3.14" ]]; then
            pip install --ignore-requires-python "pytest~=${{ matrix.pytest }}.0" -e ".[test]"
          else
            pip install "pytest~=${{ matrix.pytest }}.0" -e ".[test]"
          fi

      - name: Record what is installed, and prove the pytest pin took
        env:
          WANT: ${{ matrix.pytest }}
        run: |
          python -c "import sys, pytest; print(sys.version); print('pytest', pytest.__version__)"
          pip list | grep -E '^pytest($|-)|^coverage|^packaging'
          python -c "import os, pytest; got = pytest.__version__.split('.')[0]; want = os.environ['WANT']; raise SystemExit(0 if got == want else f'wanted pytest {want}, got {pytest.__version__}')"

      - name: Run the suite
        run: pytest tests/ --receptor=llm

      - name: Run the suite distributed
        # MolSysMT runs twelve workers, so the plugin has to survive being run
        # under the thing it is expected to report on.
        run: pytest tests/ -n 2 --receptor=llm

  benchmarks:
    # The published figures are a claim about behaviour, so the harness that
    # produces them has to keep running.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[benchmark]"
      - run: python devtools/benchmarks/run_benchmarks.py
      - run: python devtools/benchmarks/run_performance.py --tests 500 --repeat 2

  packaging:
    # PR-OPS-001 shipped a requires-python that rejected the very interpreter
    # the project was developed on. Build and install for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import pytest_receptor; print(pytest_receptor.__version__)"
          cd /tmp && /tmp/clean/bin/pytest --receptor=llm --help > /dev/null
