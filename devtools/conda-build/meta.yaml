{% set name = "pytest-receptor" %}

package:
  name: {{ name|lower }}
  version: "{{ environ['GIT_DESCRIBE_TAG'] }}"

source:
  path: ../..

build:
  number: 0
  # Pure Python, no compiled extensions: one architecture-independent package
  # installs on linux, osx and win. The run/python constraint below (>=3.11,<3.15)
  # makes the same package valid on Python 3.11 through 3.14. No build matrix.
  noarch: python

requirements:
  host:
    - python >=3.11,<3.15
    - pip
    - setuptools >=77.0
    - versioningit >=3.0
  run:
    - python >=3.11,<3.15
    - pytest >=8.0.0

test:
  imports:
    - pytest_receptor
  commands:
    - pytest --help

about:
  home: https://github.com/uibcdf/pytest-receptor
  license: MIT
  summary: A pytest plugin to adapt test output for different receptors (humans, LLMs, CI).
  dev_url: https://github.com/uibcdf/pytest-receptor
