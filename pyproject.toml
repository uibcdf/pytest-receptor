[build-system]
requires = ["setuptools>=77.0", "versioningit>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-receptor"
dynamic = ["version"]
description = "A pytest plugin to adapt test output for different receptors (humans, LLMs, CI)."
readme = "README.md"
keywords = ["pytest", "plugin", "testing", "LLM", "CI"]
authors = [
    { name = "UIBCDF Development Team" },
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pytest>=8.0.0",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/uibcdf/pytest-receptor"
Repository = "https://github.com/uibcdf/pytest-receptor"
Issues = "https://github.com/uibcdf/pytest-receptor/issues"
Changelog = "https://github.com/uibcdf/pytest-receptor/blob/main/CHANGELOG.md"

[project.entry-points."pytest11"]
receptor = "pytest_receptor.plugin"

[project.optional-dependencies]
test = [
    "packaging>=24",
    "pytest-cov>=6,<8",
    "pytest-rerunfailures>=15,<17",
    "pytest-subtests>=0.14,<0.16",
    "pytest-xdist>=3.6,<4",
]
lint = [
    "ruff==0.16.1",
]
docs = [
    "myst-parser>=4,<5",
    "sphinx>=8,<10",
    "sphinx-rtd-theme>=3,<4",
]
benchmark = [
    "tiktoken>=0.9,<1",
]
release = [
    "build>=1.2,<2",
    "packaging>=24",
    "twine>=6,<7",
]
dev = [
    "build>=1.2,<2",
    "myst-parser>=4,<5",
    "packaging>=24",
    "pytest-cov>=6,<8",
    "pytest-rerunfailures>=15,<17",
    "pytest-subtests>=0.14,<0.16",
    "pytest-xdist>=3.6,<4",
    "ruff==0.16.1",
    "sphinx>=8,<10",
    "sphinx-rtd-theme>=3,<4",
    "tiktoken>=0.9,<1",
    "twine>=6,<7",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pytest_receptor*"]

# The version has a single source of truth: the git tag. versioningit derives it
# at build time and writes pytest_receptor/_version.py (gitignored), the same
# convention as the rest of the UIBCDF suite (argdigest, pyunitwizard). The conda
# recipe reads GIT_DESCRIBE_TAG from the same tag, so nothing is edited by hand.
[tool.versioningit]
default-version = "0.0.0+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
method = "git"
match = ["*"]
default-tag = "0.0.0"

[tool.versioningit.write]
file = "pytest_receptor/_version.py"
